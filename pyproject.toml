[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headout-qa-bot"
version = "0.1.0"
description = "Auto-QA harness for Headout's Zendesk AI Agent via Sunshine Conversations"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
headout-qa = "headout_qa.cli:main"

[tool.setuptools.packages.find]
include = ["headout_qa*"]
